[workspace]
resolver = "2"
members = [
    "contracts/commitment",
    "contracts/nullifier",
    "contracts/verifier",
    "contracts/transfer",
    "examples/merchant-settlement",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
soroban-sdk = "25.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
codegen-units = 1
lto = true
panic = "abort"
