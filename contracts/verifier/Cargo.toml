[package]
name = "hypertron-verifier"
description = "Hypertron Privacy Protocol — on-chain Groth16 proof verifier (BLS12-381)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Independent Groth16 prover used to generate REAL proofs in tests. Matches the
# arkworks 0.4.x version and serialization the Soroban host uses internally, so
# fixtures are byte-identical to on-chain expectations.
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = { version = "0.4", default-features = false }
ark-relations = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
